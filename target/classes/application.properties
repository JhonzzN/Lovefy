# Configuração de conexão com o banco de dados

server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/Lovefy
spring.datasource.username=postgres
spring.datasource.password=10203040

# Configurações do JPA/Hibernate
# "validate" garante que o Java apenas valide as tabelas que você já criou via script, sem tentar apagar ou recriar nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

# Define onde os arquivos serão salvos (Crie essa pasta no seu computador)
file.upload-dir=./uploads
# Aumenta o limite de tamanho para aceitar MP3s pesados
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB